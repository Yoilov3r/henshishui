<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="阴雨不歇，水位自涨。两篇戏文《恨逝水》《纂事近》，行楷竖排，随积水一寸寸沉入水中。">
<title>恨逝水 · 纂事近</title>
<style>
  @font-face {
    font-family: 'PoemKai';
    src: url(data:font/woff2;base64,__FONT_POEM__) format('woff2');
    font-display: block;
  }
  @font-face {
    font-family: 'TitleXing';
    src: url(data:font/woff2;base64,__FONT_TITLE__) format('woff2');
    font-display: block;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #04070a;
    color: #e9efe8;
    -webkit-font-smoothing: antialiased;
  }
  html { overflow: hidden; height: 100%; }
  body { height: 100%; overflow: hidden; }
  body.scrollable { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #scene {
    position: fixed;
    left: 0;
    top: 0;
    display: block;
    touch-action: pan-y;
  }
  #spacer { position: relative; width: 100%; pointer-events: none; }
  #chrome {
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  #chrome .ctl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid rgba(190, 214, 214, 0.16);
    background: rgba(6, 14, 18, 0.42);
    color: rgba(214, 228, 226, 0.62);
    font-size: 12px;
    line-height: 1;
    letter-spacing: 0;
    text-decoration: none;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: color 220ms ease, border-color 220ms ease, background 220ms ease;
  }
  #chrome .ctl:hover, #chrome .ctl:focus-visible {
    color: rgba(238, 246, 244, 0.95);
    border-color: rgba(214, 236, 234, 0.42);
    background: rgba(10, 22, 27, 0.62);
    outline: none;
  }
  #chrome .ctl svg { width: 15px; height: 15px; flex: none; }
  #sound { padding: 0 8px; }
  #sound .ico-on { display: none; }
  #sound[data-on="1"] .ico-on { display: inline; }
  #sound[data-on="1"] .ico-off { display: none; }
  #sound[data-on="1"] { color: rgba(238, 246, 244, 0.9); }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  /* 字体就绪前不闪白 */
  #scene { opacity: 0; transition: opacity 900ms ease; }
  #scene.ready { opacity: 1; }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="spacer"></div>
<div class="sr-only" id="libretto"></div>
<nav id="chrome">
  <button id="sound" class="ctl" type="button" hidden data-on="0" aria-pressed="false" title="开启雷声">
    <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" x2="16" y1="9" y2="15"></line><line x1="16" x2="22" y1="9" y2="15"></line></svg>
    <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
  </button>
  <a id="alt" class="ctl" href="__ALT_HREF__" title="切换到__ALT_LABEL__">__ALT_LABEL__<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
</nav>
<script>__POEMS_JS__</script>
<script>__AUDIO_JS__</script>
<script>__SCENE_JS__</script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('scene');
  var spacer = document.getElementById('spacer');
  var params = new URLSearchParams(location.search);
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MODE = '__MODE__';
  var still = params.get('still') === '1';
  var forcedT = params.has('t') ? parseFloat(params.get('t')) : null;
  var forcedLevel = params.has('level') ? parseFloat(params.get('level')) : null;
  var engine = null, last = 0, running = false;
  var audio = null, soundBtn = document.getElementById('sound');

  function refreshSound() {
    if (!soundBtn) return;
    var on = !!(audio && audio.isOn());
    soundBtn.setAttribute('data-on', on ? '1' : '0');
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.title = on ? '关闭雷声' : '开启雷声';
  }

  function setupAudio() {
    if (MODE !== 'storm' || !window.RainAudio || !window.RainAudio.available() || !soundBtn) return;
    audio = window.RainAudio.create();
    soundBtn.hidden = false;
    refreshSound();
    soundBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    soundBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (audio.isOn()) { audio.disable(); audio.userMuted = true; }
      else { audio.enable(); audio.userMuted = false; }
      refreshSound();
    });
    function firstGesture() {
      if (!audio.userMuted && !audio.isOn()) { audio.enable(); refreshSound(); }
    }
    window.addEventListener('pointerdown', firstGesture, { passive: true });
    window.addEventListener('keydown', firstGesture);
    document.addEventListener('visibilitychange', function () { audio.setHidden(document.hidden); });
  }

  function onStrike(evt) {
    if (audio && audio.isOn()) audio.thunder(evt.distance, evt.power);
  }

  function readViewport() {
    var vv = window.visualViewport;
    var w = Math.round(window.innerWidth || (vv && vv.width) || 1024);
    var h = Math.round(window.innerHeight || (vv && vv.height) || 768);
    return { w: Math.max(300, w), h: Math.max(300, h), dpr: Math.min(2, window.devicePixelRatio || 1) };
  }

  function applyLayout(info) {
    if (info.mode === 'wrap') {
      document.body.classList.add('scrollable');
      document.documentElement.classList.add('scrollable');
      document.documentElement.style.height = 'auto';
      document.body.style.height = 'auto';
      spacer.style.height = info.docHeight + 'px';
    } else {
      document.body.classList.remove('scrollable');
      document.documentElement.classList.remove('scrollable');
      document.documentElement.style.height = '100%';
      document.body.style.height = '100%';
      spacer.style.height = '0px';
      if (window.scrollY) window.scrollTo(0, 0);
    }
    engine.setScroll(window.scrollY || 0);
  }

  function resize() {
    if (!engine) return;
    var v = readViewport();
    var keep = engine.level();
    var info = engine.resize(v.w, v.h, v.dpr);
    engine.setElapsed(engine.state().t);
    applyLayout(info);
    if (forcedLevel !== null) engine.setElapsed(window.RainScene.timeForLevel(forcedLevel));
    else if (keep > 0) { /* 保持当前水位 */ }
  }

  function frame(now) {
    if (!running) return;
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (document.hidden) dt = 0;
    if (dt > 0.25) dt = 0.25;
    if (!still) engine.advance(dt);
    engine.draw();
    if (still) { running = false; return; }
    requestAnimationFrame(frame);
  }

  function buildLibretto() {
    var host = document.getElementById('libretto');
    var frag = document.createDocumentFragment();
    (window.RAIN_POEMS || []).forEach(function (poem) {
      var h = document.createElement('h2');
      h.textContent = poem.title;
      frag.appendChild(h);
      var pre = document.createElement('p');
      pre.textContent = poem.lines.join('\n');
      pre.style.whiteSpace = 'pre-line';
      frag.appendChild(pre);
    });
    host.appendChild(frag);
  }

  function start() {
    engine = window.RainScene.create(canvas, {
      poems: window.RAIN_POEMS,
      families: {
        poem: '"PoemKai", "KaiTi", "STKaiti", "Kaiti SC", serif',
        title: '"TitleXing", "STXingkai", "KaiTi", serif',
        fallback: '"KaiTi", "STKaiti", "Kaiti SC", serif'
      },
      mode: MODE,
      reducedMotion: reduced,
      onStrike: onStrike
    });
    setupAudio();
    var v = readViewport();
    var info = engine.resize(v.w, v.h, v.dpr);
    applyLayout(info);
    if (forcedLevel !== null) engine.setElapsed(window.RainScene.timeForLevel(forcedLevel));
    else if (forcedT !== null) engine.setElapsed(forcedT);
    engine.simulate(still ? 6 : 3.2);
    if (still && params.get('bolt') === '1') engine.strike();
    canvas.classList.add('ready');
    window.__rainEngine = engine;
    buildLibretto();
    window.addEventListener('resize', debounce(resize, 220), { passive: true });
    window.addEventListener('orientationchange', debounce(resize, 320), { passive: true });
    window.addEventListener('scroll', function () { engine.setScroll(window.scrollY || 0); }, { passive: true });
    document.addEventListener('visibilitychange', function () { last = 0; });
    running = true;
    requestAnimationFrame(frame);
  }

  function debounce(fn, ms) {
    var id = 0;
    return function () {
      clearTimeout(id);
      id = setTimeout(fn, ms);
    };
  }

  var ready = Promise.resolve();
  if (document.fonts && document.fonts.load) {
    ready = Promise.all([
      document.fonts.load('20px PoemKai', '恨逝水纂事近'),
      document.fonts.load('20px TitleXing', '恨逝水纂事近')
    ]);
  }
  var guard = new Promise(function (r) { setTimeout(r, 2500); });
  Promise.race([ready, guard]).then(start).catch(start);
})();
</script>
</body>
</html>
